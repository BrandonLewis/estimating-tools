[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "estimating_tools"
version = "0.1.99"
description = "Deterministic construction estimating and engineering tools."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
# bimforge >=0.1.108 requires 3.11+; 3.10 reaches end of life in October 2026.
requires-python = ">=3.11"
# bimforge is FLOORED, not bare. It is developed and released in
# BrandonLewis/BIMForge; the plugins bundle exactly the floored PyPI release
# (scripts/build_plugin_wheel.py --pypi bimforge), so raising this floor is how
# a newer bimforge ships. Keep the [all] floor below equal.
# jsonschema is base: every exchange read validates the book's declaration,
# and every HeavyBook build loads it (pure Python).
dependencies = ["pyyaml", "bimforge>=0.1.113", "jsonschema"]

[project.optional-dependencies]
excel = ["openpyxl"]
pdf = ["pdfplumber"]
schedule = ["openpyxl"]
# ruamel.yaml: `est-estimate read-back --write` rewrites the spec in round-trip
# mode so the estimator's comments, key order and quoting survive. 0.18 and
# 0.19 are both proven (no pip-audit advisory for either); 0.20 is unreleased.
estimate_spec = ["openpyxl", "pyyaml", "jsonschema", "ruamel.yaml>=0.18,<0.20"]
docgen = ["docxtpl", "python-docx", "markdown-it-py", "openpyxl"]
profiles = ["jsonschema", "pyyaml"]
intake = ["pyyaml"]
importers = ["openpyxl", "jsonschema"]
plugin-core = ["openpyxl", "jsonschema", "pdfplumber", "python-docx", "mcp>=2,<3", "ruamel.yaml>=0.18,<0.20"]
# Test-only: pycel evaluates the workbooks the test suite builds. Never in
# `all` -- pycel 1.0b30 carries CVE-2024-53924 (evaluating an untrusted
# workbook runs code), and `all` is what users install. Pinned to 1.0b30.x:
# the ast.Str compatibility shim (Python 3.8+ renamed ast.Str to ast.Constant)
# is tied to 1.0b30's call shape, and a later pycel may change it.
test = ["pycel>=1.0b30,<1.1"]
dev = ["estimating_tools[all,test]", "build"]
all = ["openpyxl", "pdfplumber", "docxtpl", "python-docx", "markdown-it-py", "pytest", "jsonschema", "mcp>=2,<3", "bimforge[all]>=0.1.113", "ruamel.yaml>=0.18,<0.20"]

[project.urls]
Homepage = "https://github.com/BrandonLewis/estimating-tools"
Source = "https://github.com/BrandonLewis/estimating-tools"
Changelog = "https://github.com/BrandonLewis/estimating-tools/blob/main/CHANGELOG.md"
Security = "https://github.com/BrandonLewis/estimating-tools/security/policy"

[project.scripts]
asm-import = "estimating_tools.assemblies.cli:main"
asm-load = "estimating_tools.assemblies.load_cli:main"
dir-import = "estimating_tools.directory.cli:main"
dir-sync = "estimating_tools.directory.sync_cli:main"
est-takeoff = "estimating_tools.takeoff.cli:main"
est-letterhead = "estimating_tools.docgen.letterhead_cli:main"
est-estimate = "estimating_tools.estimate_spec.cli:main"
est-gantt = "estimating_tools.schedule.gantt_to_ganttwarrior:main"
est-schedule = "estimating_tools.schedule.cli:main"
est-hist = "estimating_tools.historicals.cli:main"
est-scaffold = "estimating_tools.profiles.scaffold:main"
est-intake = "estimating_tools.intake.cli:main"
est-rebar = "estimating_tools.rebar.cli:main"
est-quotespace = "estimating_tools.quotespace.cli:main"
est-quotes = "estimating_tools.quotes.intake.cli:main"
profile-init = "estimating_tools.profiles.cli:main"
est-import = "estimating_tools.importers.cli:main"
rate-import = "estimating_tools.rates.cli:main"
costcode-import = "estimating_tools.costcodes.cli:main"
m2m-token = "estimating_tools.auth.cli:main"
est-feedback = "estimating_tools.feedback.cli:main"
est-artifact-app = "estimating_tools.artifact_app.server:main"
est-addin = "estimating_tools.addin.cli:main"

# bimforge resolves an org's CAD style pack through registered providers and
# never imports this package; this is the provider that reads the org profile.
[project.entry-points."bimforge.style_packs"]
profile = "estimating_tools.profiles.wires:cad_style_pack"

# Estimate exchange packs (roadmap 1.2). Each entry returns a Pack.
[project.entry-points."estimating_tools.packs"]
heavybook = "estimating_tools.heavybook.pack:pack"
fieldbook = "estimating_tools.estimate_spec.pack:pack"

[tool.setuptools.packages.find]
where = ["."]
include = ["estimating_tools*"]
# Tests are developer material, not shipped surface: 142 test modules were
# reaching every customer's site-packages. (Fixture .yaml/.json never shipped —
# package discovery collects only .py modules — so this is about the modules.)
exclude = [
    "estimating_tools.tests",
    "estimating_tools.tests.*",
    "estimating_tools.*.tests",
    "estimating_tools.*.tests.*",
]

[tool.setuptools.package-data]
"estimating_tools.estimate_spec" = ["schema/*.json", "packs/*.md",
                                    "packs/*/*.yaml", "packs/*/examples/*.yaml",
                                    "packs/*/examples/quotes/*.json"]
"estimating_tools.profiles" = ["schema/*.json", "trees/*.yaml"]
"estimating_tools.heavybook" = ["template/*.yaml", "template/*.xlsx", "template/*.md"]
"estimating_tools.quotes.intake" = ["prompts/*.md", "schemas/*.json"]
"estimating_tools.importers" = ["schema/*.json"]
"estimating_tools.artifact_app" = ["*.html"]
"estimating_tools.exchange" = ["schema/*.json"]
"estimating_tools.addin" = ["*.tmpl", "assets/*.svg", "assets/*.png"]

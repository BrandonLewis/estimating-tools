# Fieldbook's recipes: two item recipes (line_item, with a takeoff; lump_sum,
# without) and six book sheets before the items:
#   Bid Form · Cost Summary · Markup · Checks · Rates · Codes (hidden).
# A spec with work_packages also gets, after the items, the `Sub Spreads`
# summary and one `Sub <package>` sheet per package (config._packages, set
# by package_frames.apply_packages).
globals:
  shift_hours: { export: rates_shift.shift, scope: workbook, qualify: sheet }
  rate_table:  { export: rates.table,       scope: workbook, qualify: sheet }
  rate_names:  { export: rates.names,       scope: workbook, qualify: sheet }
  code_list:   { export: code_list.col,     scope: workbook, qualify: sheet }
  code_range:  { export: code_rows.codes,   scope: workbook, qualify: sheet }
  code_listed: { export: code_rows.listed,  scope: workbook, qualify: sheet }
  mk_labor:    { export: markup_grid.labor, scope: workbook, qualify: sheet }
  mk_equip:    { export: markup_grid.equip, scope: workbook, qualify: sheet }
  mk_matl:     { export: markup_grid.matl,  scope: workbook, qualify: sheet }
  mk_sub:      { export: markup_grid.sub,   scope: workbook, qualify: sheet }
  bond_pct:    { export: markup_grid.bond,  scope: workbook, qualify: sheet }

recipes:
  line_item:
    column_widths: &widths
      { A: 34, B: 10, C: 7, D: 11, E: 11, F: 13, G: 10, H: 12, I: 10, J: 24,
        K: 8, L: 12, M: 12, N: 12, O: 12, P: 13, Q: 10, R: 10, S: 6, T: 6 }
    hidden_columns: &tags [Q, R, S, T, U, V]
    freeze: A2                         # the header band (item #, description, bid qty) stays put
    print: &item_print { orientation: landscape, fit_to_width: 1, repeat_rows: "1:1" }
    units:
      - unit: item_header
        params:
          item_no: "{item.item_no}"
          description: "{item.description}"
          qty: { from: item.qty, default: 1 }
          uom: "{item.uom}"
          takeoff_total: "={ref:quantity.total}"
      - &notes { unit: scope_notes, when: item.notes, params: { lines: "{item.notes}" } }
      - unit: quantity
        variant_from: item.takeoff.kind
        variants: takeoff_kinds
        key: quantity
        params: "{item.takeoff}"
      - &recap
        unit: recap
        params:
          tasks: { for_each: item.labor, as: { code: "{it.cost_code}" } }
          uom: "{item.uom}"
      - &heads { unit: detail_heads }
      - &tasks
        unit: task
        for_each: item.labor
        key: "task[{it.cost_code}]"
        params:
          cost_code: "{it.cost_code}"
          description: "{it.description}"
          notes: { from: it.notes, default: [] }
          sp_note: { from: it.sp_note }
          # u_tag / arr_* / pkg_ref: set by the work-package transform only
          # (see package_frames.apply_packages); the defaults are an
          # unpackaged task's own columns.
          crew:
            for_each: it.crew
            as:
              trade: "{it.trade}"
              count: { from: it.count, default: 1 }
              days:  "{it.days}"
              u_tag: { from: it.u_tag, default: "" }
              arr_days: { from: it.arr_days, default: "E{r}" }
          lines:
            for_each: it.lines
            as:
              name: "{it.name}"
              qty: "{it.qty}"
              uom: { from: it.uom, default: "" }
              unit_price: "{it.unit_price}"
              cost_type: "{it.cost_type}"
              source: { from: it.source, default: plug }
              vendor: { from: it.vendor, default: "" }
              index: { from: it_index }
              u_tag: { from: it.u_tag, default: "" }
              arr_qty: { from: it.arr_qty, default: "B{r}" }
              arr_price: { from: it.arr_price, default: "G{r}" }
              pkg_ref: { from: it.pkg_ref, default: "" }

  lump_sum:
    column_widths: *widths
    hidden_columns: *tags
    freeze: A2
    print: *item_print
    units:
      - unit: item_header
        params:
          item_no: "{item.item_no}"
          description: "{item.description}"
          qty: { from: item.qty, default: 1 }
          uom: "{item.uom}"
          takeoff_total: "n/a"
      - *notes
      - *recap
      - *heads
      - *tasks

takeoff_kinds:
  linear:   takeoff_linear
  count:    takeoff_count
  measured: takeoff_measured

book:
  - sheet_name: Bid Form
    position: before_items
    column_widths: { A: 10, B: 40, C: 12, D: 8, E: 14, F: 16 }
    freeze: A4                         # project, bid date and column heads stay put
    print: { orientation: portrait, fit_to_width: 1, repeat_rows: "1:3" }   # one page wide
    units:
      - unit: bid_form_head
        params:
          project: "{config.project}"
          bid_date: { from: config.bid_date, default: "" }
      - unit: bid_form_row
        for_each: book.items
        key: "bf[{it.item_no}]"
        params:
          item_no: "{it.item_no}"
          sheet: "{it.sheet}"
          description: "{it.description}"
          uom: "{it.uom}"
      - unit: bid_form_total
      - unit: bid_form_status

  - sheet_name: Cost Summary
    position: before_items
    column_widths: { A: 8, B: 34, C: 8, D: 12, E: 12, F: 12, G: 12, H: 13, I: 12, J: 12, K: 12, L: 14 }
    freeze: C3                         # column heads, item # and description stay put
    print: { orientation: landscape, fit_to_width: 1, repeat_rows: "1:2" }
    units:
      - unit: cost_summary_head
      - unit: cost_summary_row
        for_each: book.items
        key: "cs[{it.item_no}]"
        params:
          item_no: "{it.item_no}"
          sheet: "{it.sheet}"
          description: "{it.description}"
      - unit: cost_summary_total

  - sheet_name: Markup
    position: before_items
    column_widths: { A: 26, B: 34, C: 12, D: 12, E: 12, G: 8 }
    hidden_columns: [G]
    units:
      - unit: markup_grid
        params:
          bond: { from: config.markup.bond_pct, default: 0 }
          rows:
            - name: Overhead
              labor:       { from: config.markup.overhead.labor, default: 0 }
              equipment:   { from: config.markup.overhead.equipment, default: 0 }
              material:    { from: config.markup.overhead.material, default: 0 }
              subcontract: { from: config.markup.overhead.subcontract, default: 0 }
            - name: Insurance
              labor:       { from: config.markup.insurance.labor, default: 0 }
              equipment:   { from: config.markup.insurance.equipment, default: 0 }
              material:    { from: config.markup.insurance.material, default: 0 }
              subcontract: { from: config.markup.insurance.subcontract, default: 0 }
            - name: Profit
              labor:       { from: config.markup.profit.labor, default: 0 }
              equipment:   { from: config.markup.profit.equipment, default: 0 }
              material:    { from: config.markup.profit.material, default: 0 }
              subcontract: { from: config.markup.profit.subcontract, default: 0 }
      - unit: unbalance_head
      - unit: unbalance_row
        for_each: book.items
        key: "unbalance_row[{it.item_no}]"
        params:
          item_no: "{it.item_no}"
          description: "{it.description}"
          unbalance: { from: it.unbalance, default: 0 }
      - unit: unbalance_total
      - unit: markup_guard
        when: config.markup
        params: { names: { for_each: config.markup, as: "{it}" } }

  - sheet_name: Checks
    position: before_items
    column_widths: { A: 5, B: 56, C: 8, D: 14, E: 14, F: 9 }
    freeze: A4
    print: { orientation: portrait, fit_to_width: 1, repeat_rows: "1:3" }
    units:
      - unit: checks_head
      - { unit: check_takeoff,  for_each: book.items, key: "ck1[{it.item_no}]", params: &check_item { item_no: "{it.item_no}", sheet: "{it.sheet}" } }
      - { unit: check_rates,    for_each: book.items, key: "ck2[{it.item_no}]", params: *check_item }
      - { unit: check_lines,    for_each: book.items, key: "ck3[{it.item_no}]", params: *check_item }
      - { unit: check_unbalance }
      - { unit: check_recap,    for_each: book.items, key: "ck5[{it.item_no}]", params: *check_item }
      - { unit: check_bid_form, for_each: book.items, key: "ck6[{it.item_no}]", params: *check_item }
      - { unit: check_codes,    for_each: book.items, key: "ck7[{it.item_no}]", params: *check_item }
      - { unit: check_operator, for_each: book.items, key: "ck8[{it.item_no}]", params: *check_item }
      - { unit: check_code_list, when: config.cost_codes, for_each: book.items, key: "ck9[{it.item_no}]", params: *check_item }
      - { unit: check_packages, when: config._packages, for_each: config._packages, key: "ck10[{it.name}]",
          params: { name: "{it.name}", sheet: "{it.title}" } }

  - sheet_name: Rates
    position: before_items
    column_widths: { A: 30, B: 11, C: 10, D: 10, E: 10, F: 17, G: 10, H: 10 }
    freeze: A5                         # the table's column heads stay put
    units:
      - unit: rates_shift
        params: { shift_hours: { from: config.shift_hours, default: 8 } }
      - unit: rates
        params:
          rates:
            for_each: config.rate_table
            as:
              trade: "{it.trade}"
              rate: "{it.rate}"
              kind: { from: it.kind, default: labor }
              base: { from: it.base, default: "" }
              burden_pct: { from: it.burden_pct, default: "" }
              fringe: { from: it.fringe, default: "" }
              includes_operator: { from: it.includes_operator, default: false }

  - sheet_name: Codes
    position: before_items
    hidden: true
    column_widths: { A: 12, B: 40, C: 8 }
    units:
      - unit: code_rows
        params:
          codes:                       # the org's list, then each task code not on it
            unique: code
            concat:
              - for_each: config.cost_codes
                as: { code: "{it.code}", description: { from: it.description, default: "" }, listed: 1 }
              - concat:
                  for_each: config.items
                  as:
                    for_each: it.labor
                    as: { code: "{it.cost_code}", description: "{it.description}", listed: 0 }
      - unit: code_list

  - sheet_name: Sub Spreads
    position: after_items
    when: config._packages
    column_widths: { A: 22, B: 12, C: 12, D: 13, E: 18, F: 13, G: 16, H: 13, I: 13, J: 11 }
    freeze: A3
    units:
      - unit: package_summary_head
      - unit: package_summary_row
        for_each: config._packages
        key: "sum[{it.name}]"
        params:
          name: "{it.name}"
          kind: "{it.kind}"
          strategy: "{it.strategy}"
          sheet: "{it.title}"
          lump: "{it.lump_flag}"

  - sheet_name: "{sheet.title}"
    position: after_items
    for_each: config._packages
    column_widths: { A: 8, B: 30, C: 9, D: 10, E: 7, F: 11, G: 12, H: 13, I: 10, J: 12 }
    units:
      - unit: package_head
        key: head
        params:
          name: "{sheet.name}"
          kind: "{sheet.kind}"
          strategy: "{sheet.strategy}"
          selected: "{sheet.selected}"
          vendors: "{sheet.vendors}"
      - { unit: package_lines, key: lines, params: { vendors: "{sheet.vendors}", lines: "{sheet.lines}" } }
      - { unit: package_items, key: items, params: { vendors: "{sheet.vendors}", items: "{sheet.items}" } }
      - { unit: package_totals, key: totals, params: { vendors: "{sheet.vendors}" } }
      - { unit: package_conditions, key: conditions, when: sheet.conditions,
          params: { vendors: "{sheet.vendors}", conditions: "{sheet.conditions}" } }
      - { unit: package_detail, key: detail, when: sheet.detail_rows, params: { rows: "{sheet.detail_rows}" } }

# Fieldbook's recipes: two item recipes (line_item, with a takeoff; lump_sum,
# without) and six book sheets before the items:
#   Bid Form · Cost Summary · Markup · Checks · Rates · Codes (hidden).
globals:
  shift_hours: { export: rates_shift.shift, scope: workbook, qualify: sheet }
  rate_table:  { export: rates.table,       scope: workbook, qualify: sheet }
  rate_names:  { export: rates.names,       scope: workbook, qualify: sheet }
  code_list:   { export: code_list.col,     scope: workbook, qualify: sheet }
  mk_labor:    { export: markup_grid.labor, scope: workbook, qualify: sheet }
  mk_equip:    { export: markup_grid.equip, scope: workbook, qualify: sheet }
  mk_matl:     { export: markup_grid.matl,  scope: workbook, qualify: sheet }
  mk_sub:      { export: markup_grid.sub,   scope: workbook, qualify: sheet }
  bond_pct:    { export: markup_grid.bond,  scope: workbook, qualify: sheet }

recipes:
  line_item:
    column_widths: &widths
      { A: 34, B: 10, C: 7, D: 11, E: 11, F: 13, G: 10, H: 12, I: 10, J: 24,
        K: 8, L: 12, M: 12, N: 12, O: 12, P: 13, Q: 10, R: 10, S: 6, T: 6 }
    hidden_columns: &tags [Q, R, S, T]
    units:
      - unit: item_header
        params:
          item_no: "{item.item_no}"
          description: "{item.description}"
          qty: { from: item.qty, default: 1 }
          uom: "{item.uom}"
          takeoff_total: "={ref:quantity.total}"
      - &notes { unit: scope_notes, when: item.notes, params: { lines: "{item.notes}" } }
      - unit: quantity
        variant_from: item.takeoff.kind
        variants: takeoff_kinds
        key: quantity
        params: "{item.takeoff}"
      - &recap
        unit: recap
        params:
          tasks: { for_each: item.labor, as: { code: "{it.cost_code}" } }
          uom: "{item.uom}"
      - &heads { unit: detail_heads }
      - &tasks
        unit: task
        for_each: item.labor
        key: "task[{it.cost_code}]"
        params:
          cost_code: "{it.cost_code}"
          description: "{it.description}"
          notes: { from: it.notes, default: [] }
          crew:
            for_each: it.crew
            as:
              trade: "{it.trade}"
              count: { from: it.count, default: 1 }
              days:  "{it.days}"
          lines:
            for_each: it.lines
            as:
              name: "{it.name}"
              qty: "{it.qty}"
              uom: { from: it.uom, default: "" }
              unit_price: "{it.unit_price}"
              cost_type: "{it.cost_type}"
              source: { from: it.source, default: plug }
              vendor: { from: it.vendor, default: "" }

  lump_sum:
    column_widths: *widths
    hidden_columns: *tags
    units:
      - unit: item_header
        params:
          item_no: "{item.item_no}"
          description: "{item.description}"
          qty: { from: item.qty, default: 1 }
          uom: "{item.uom}"
          takeoff_total: "n/a"
      - *notes
      - *recap
      - *heads
      - *tasks

takeoff_kinds:
  linear:   takeoff_linear
  count:    takeoff_count
  measured: takeoff_measured

book:
  - sheet_name: Bid Form
    position: before_items
    column_widths: { A: 10, B: 40, C: 12, D: 8, E: 14, F: 16 }
    units:
      - unit: bid_form_head
        params:
          project: "{config.project}"
          bid_date: { from: config.bid_date, default: "" }
      - unit: bid_form_row
        for_each: book.items
        key: "bf[{it.item_no}]"
        params:
          item_no: "{it.item_no}"
          sheet: "{it.sheet}"
          description: "{it.description}"
          uom: "{it.uom}"
      - unit: bid_form_total
      - unit: bid_form_status

  - sheet_name: Cost Summary
    position: before_items
    column_widths: { A: 8, B: 34, C: 8, D: 12, E: 12, F: 12, G: 12, H: 13, I: 12, J: 12, K: 12, L: 14 }
    units:
      - unit: cost_summary_head
      - unit: cost_summary_row
        for_each: book.items
        key: "cs[{it.item_no}]"
        params:
          item_no: "{it.item_no}"
          sheet: "{it.sheet}"
          description: "{it.description}"
      - unit: cost_summary_total

  - sheet_name: Markup
    position: before_items
    column_widths: { A: 26, B: 34, C: 12, D: 12, E: 12, G: 8 }
    hidden_columns: [G]
    units:
      - unit: markup_grid
        params:
          bond: { from: config.markup.bond_pct, default: 0 }
          rows:
            - name: Overhead
              labor:       { from: config.markup.overhead.labor, default: 0 }
              equipment:   { from: config.markup.overhead.equipment, default: 0 }
              material:    { from: config.markup.overhead.material, default: 0 }
              subcontract: { from: config.markup.overhead.subcontract, default: 0 }
            - name: Insurance
              labor:       { from: config.markup.insurance.labor, default: 0 }
              equipment:   { from: config.markup.insurance.equipment, default: 0 }
              material:    { from: config.markup.insurance.material, default: 0 }
              subcontract: { from: config.markup.insurance.subcontract, default: 0 }
            - name: Profit
              labor:       { from: config.markup.profit.labor, default: 0 }
              equipment:   { from: config.markup.profit.equipment, default: 0 }
              material:    { from: config.markup.profit.material, default: 0 }
              subcontract: { from: config.markup.profit.subcontract, default: 0 }
      - unit: unbalance_head
      - unit: unbalance_row
        for_each: book.items
        key: "unbalance_row[{it.item_no}]"
        params:
          item_no: "{it.item_no}"
          description: "{it.description}"
          unbalance: { from: it.unbalance, default: 0 }
      - unit: unbalance_total
      - unit: markup_guard
        when: config.markup
        params: { names: { for_each: config.markup, as: "{it}" } }

  - sheet_name: Checks
    position: before_items
    column_widths: { A: 5, B: 56, C: 8, D: 14, E: 14, F: 9 }
    units:
      - unit: checks_head
      - { unit: check_takeoff,  for_each: book.items, key: "ck1[{it.item_no}]", params: &check_item { item_no: "{it.item_no}", sheet: "{it.sheet}" } }
      - { unit: check_rates,    for_each: book.items, key: "ck2[{it.item_no}]", params: *check_item }
      - { unit: check_lines,    for_each: book.items, key: "ck3[{it.item_no}]", params: *check_item }
      - { unit: check_unbalance }
      - { unit: check_recap,    for_each: book.items, key: "ck5[{it.item_no}]", params: *check_item }
      - { unit: check_bid_form, for_each: book.items, key: "ck6[{it.item_no}]", params: *check_item }
      - { unit: check_codes,    for_each: book.items, key: "ck7[{it.item_no}]", params: *check_item }
      - { unit: check_operator, for_each: book.items, key: "ck8[{it.item_no}]", params: *check_item }

  - sheet_name: Rates
    position: before_items
    column_widths: { A: 30, B: 11, C: 10, D: 10, E: 10, F: 17, G: 10, H: 10 }
    units:
      - unit: rates_shift
        params: { shift_hours: { from: config.shift_hours, default: 8 } }
      - unit: rates
        params:
          rates:
            for_each: config.rate_table
            as:
              trade: "{it.trade}"
              rate: "{it.rate}"
              kind: { from: it.kind, default: labor }
              base: { from: it.base, default: "" }
              burden_pct: { from: it.burden_pct, default: "" }
              fringe: { from: it.fringe, default: "" }
              includes_operator: { from: it.includes_operator, default: false }

  - sheet_name: Codes
    position: before_items
    hidden: true
    column_widths: { A: 12, B: 40 }
    units:
      - unit: code_rows
        for_each: book.items
        params: { tasks: { from: it.labor, default: [] } }
      - unit: code_list

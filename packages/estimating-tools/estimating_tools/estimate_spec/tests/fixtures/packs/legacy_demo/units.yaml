# The demo pack's units. Same row grammar as the reference pack's units.yaml;
# a six-column (A:F) grid.
units:

  job_header:
    params:
      item_no:     { type: string }
      description: { type: string }
      qty:         { type: formula }
      uom:         { type: string }
    rows:
      - cells: { A: { formula: "='Bid Summary'!A2", style: cover_title } }
        merge: "A:F"
      - cells:
          A: { value: "{p.item_no}",     style: identity }
          B: { value: "{p.description}", style: identity }
          E: { formula: "{p.qty}",       style: identity, number_format: qty }
          F: { value: "{p.uom}",         style: identity }
        merge: "B:D"
        mark: id
    exports:
      qty: "$E${row:id}"

  scope_notes:
    params: { lines: { type: list, of: string } }
    rows:
      - repeat: p.lines
        cells: { A: { value: "{it}", style: notes } }
        fill_row: notes
        merge: "A:F"

  rates:
    anchor: { col: A, row: 1 }            # its own sheet (recipe `sheet: Rates`)
    params: { rates: { type: list } }
    rows:
      - cells:
          A: { value: "TRADE", style: summary_head }
          B: { value: "$/HR",  style: summary_head }
      - repeat: p.rates
        cells:
          A: { value: "{it.trade}", style: label }
          B: { value: "{it.rate}",  style: rate }
        mark_first: rate_first
        mark_last:  rate_last
    exports:
      table: "$A${row:rate_first}:$B${row:rate_last}"

  quantity_linear:
    params: { segments: { type: list } }
    rows:
      - cells:
          A: { value: "SEGMENT",  style: takeoff_head }
          B: { value: "LF",       style: takeoff_head }
          C: { value: "DEPTH FT", style: takeoff_head }
      - repeat: p.segments
        cells:
          A: { value: "{it.label}",     style: takeoff_item }
          B: { value: "{it.length_lf}", style: takeoff_num }
          C: { value: "{it.depth_ft}",  style: takeoff_num, optional: true }
        mark_first: seg_first
        mark_last:  seg_last
      - cells:
          A: { value: "TOTAL LF", style: label }
          B: { formula: "=SUM(B{row:seg_first}:B{row:seg_last})", style: takeoff_sum }
        mark: total

  quantity_count:
    params: { units: { type: list } }
    rows:
      - cells:
          A: { value: "UNIT",  style: takeoff_head }
          B: { value: "COUNT", style: takeoff_head }
      - repeat: p.units
        cells:
          A: { value: "{it.label}", style: takeoff_item }
          B: { value: "{it.count}", style: takeoff_num }
        mark_first: unit_first
        mark_last:  unit_last
      - cells:
          A: { value: "TOTAL", style: label }
          B: { formula: "=SUM(B{row:unit_first}:B{row:unit_last})", style: takeoff_sum }
        mark: total

  crew_block:
    params:
      slot:        { type: string }
      description: { type: string }
      crew:        { type: list }
    rows:
      - cells: { A: { value: "[{p.slot}] {p.description}", style: section_title } }
        merge: "A:F"
      - cells:
          B: { value: "TRADE", style: crew_head }
          C: { value: "COUNT", style: crew_head }
          D: { value: "DAYS",  style: crew_head }
          E: { value: "RATE",  style: crew_head }
          F: { value: "COST",  style: crew_head }
      - repeat: p.crew
        cells:
          B: { value: "{it.trade}", style: label }
          C: { value: "{it.count}", style: crew_count }
          D: { formula: "{it.days}", style: days }
          E: { formula: "=VLOOKUP(B{r},{rate_lookup},2,FALSE)", style: rate }
          F: { formula: "=C{r}*D{r}*E{r}*8", style: ext_money }
        mark_first: crew_first
        mark_last:  crew_last
      - cells:
          E: { value: "SUBTOTAL", style: label }
          F: { formula: "=SUM(F{row:crew_first}:F{row:crew_last})", style: block_subtotal }

  labor_total:                            # sums the SUBTOTAL rows across every crew block
    params:
      first: { type: anchor }
      last:  { type: anchor }
    rows:
      - cells:
          E: { value: "LABOR", style: label }
          F: { formula: '=SUMIF(E{p.first}:E{p.last},"SUBTOTAL",F{p.first}:F{p.last})', style: subtotal_money }
        mark: total
    exports:
      labor_total: "$F${row:total}"

  haul:
    params:
      import_cy: { type: number }
      export_cy: { type: number }
      haul_rate: { type: number }
    rows:
      - cells: { A: { value: "HAUL", style: section_banner } }
        merge: "A:F"
      - cells: { A: { value: "Import CY", style: label }, C: { value: "{p.import_cy}", style: takeoff_num } }
        mark: imp
      - cells: { A: { value: "Export CY", style: label }, C: { value: "{p.export_cy}", style: takeoff_num } }
        mark: exp
      - cells:
          A: { value: "Haul $/CY", style: label }
          E: { value: "{p.haul_rate}", style: price_input }
          F: { formula: "=(C{row:imp}+C{row:exp})*E{r}", style: subtotal_money }
        mark: total
    exports:
      haul_total: "$F${row:total}"

  cost_block:
    params:
      name:  { type: string }
      lines: { type: list }
    rows:
      - cells: { A: { value: "{p.name}", style: section_banner } }
        merge: "A:F"
        mark: head
      - repeat: p.lines
        cells:
          A: { value: "{it.name}",       style: label }
          C: { formula: "{it.qty}",      style: takeoff_num }
          D: { value: "{it.uom}",        style: label, optional: true }
          E: { value: "{it.unit_price}", style: price_input }
          F: { formula: "=C{r}*E{r}",    style: ext_money }
      - cells:
          E: { value: "SUBTOTAL", style: label }
          F: { formula: "=SUM(F{row:head}:F{r-1})", style: subtotal_money }
        mark: subtotal
    exports:
      subtotal: "$F${row:subtotal}"

  cost_summary:
    params: { lines: { type: list } }
    rows:
      - repeat: p.lines
        cells:
          A: { value: "{it.name}", style: label }
          F: { formula: "{it.ref}", style: result_money }
        mark_first: line_first
        mark_last:  line_last
      - cells:
          E: { value: "COSTS", style: label }
          F: { formula: "=SUM(F{row:line_first}:F{row:line_last})", style: subtotal_money }
        mark: total
    exports:
      costs_total: "$F${row:total}"

  job_total:
    fill_region: answer_block
    params: { total_formula: { type: formula } }
    rows:
      - cells:
          E: { value: "ITEM TOTAL", style: label }
          F: { formula: "{p.total_formula}", style: total }
        mark: total
      - cells:
          E: { value: "PER UNIT", style: label }
          F: { formula: "=F{row:total}/{job_qty}", style: total }
    exports:
      grand_total: "$F${row:total}"

  bid_summary:
    params:
      project: { type: string }
      items:   { type: list }
    rows:
      - blank: 1
      - cells: { A: { value: "{p.project}", style: cover_title } }
        merge: "A:D"
      - blank: 1
      - cells:
          A: { value: "ITEM",   style: summary_head }
          D: { value: "AMOUNT", style: summary_head }
      - repeat: p.items
        cells:
          A: { formula: "={it.sheet_ref}!B2", style: label }
          D: { formula: "{it.total_export}",  style: summary_money }
        mark_first: item_first
        mark_last:  item_last
      - cells:
          C: { value: "BID TOTAL", style: label }
          D: { formula: "=SUM(D{row:item_first}:D{row:item_last})", style: result_money }
        mark: total
    exports:
      bid_total: "$D${row:total}"

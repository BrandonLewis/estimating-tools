trades: [SUPR, EQOP, LABR, PIPL, TRKD]   # superintendent, operator, laborer, pipelayer, truck driver
cost_blocks: [MATL, RENT, SUBS]
slot_pattern: "^[0-9]{2}$"               # labor slots 01, 02, ...
foreman_trade: SUPR
item_rules:
  - comment: "line items carry a quantity takeoff; setup does not."
    if:   { properties: { recipe: { const: line_item } } }
    then: { required: [takeoff] }
defs:
  takeoff:
    type: object
    required: [kind]
    properties: { kind: { enum: [linear, count] } }
    oneOf:
      - properties:
          kind: { const: linear }
          segments:
            type: array
            minItems: 1
            items:
              type: object
              additionalProperties: false
              required: [label, length_lf]
              properties:
                label:     { type: string }
                length_lf: { type: number }
                depth_ft:  { type: number }
        required: [segments]
        additionalProperties: false
      - properties:
          kind: { const: count }
          units:
            type: array
            minItems: 1
            items:
              type: object
              additionalProperties: false
              required: [label, count]
              properties:
                label: { type: string }
                count: { type: integer, minimum: 0 }
        required: [units]
        additionalProperties: false
  spreads:                                # haul: the demo's only spread
    type: object
    additionalProperties: false
    required: [import_cy, export_cy, haul_rate]
    properties:
      import_cy: { type: number }
      export_cy: { type: number }
      haul_rate: { type: number }

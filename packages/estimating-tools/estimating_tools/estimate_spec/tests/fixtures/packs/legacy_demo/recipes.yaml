# The demo pack's recipes. See estimate_spec/recipes.yaml for the entry grammar.
globals:
  job_qty:     { export: job_header.qty, scope: sheet }
  rate_lookup: { export: rates.table, scope: workbook, qualify: sheet }

recipes:
  cover:
    sheet_name: Bid Summary
    item_total_export: job_total.grand_total
    units:
      - unit: bid_summary
        params: { project: "{config.project}" }

  setup:                                  # the first item: hosts the rate sheet
    column_widths: { A: 28, B: 12, C: 10, D: 10, E: 12, F: 14 }
    units:
      - &header
        unit: job_header
        params:
          item_no: "{item.item_no}"
          description: "{item.description}"
          qty: { from: item.qty, default: 1 }
          uom: "{item.uom}"
      - &notes { unit: scope_notes, when: item.notes, params: { lines: "{item.notes}" } }
      - { unit: rates, sheet: Rates, params: { rates: "{config.rate_table}" } }
      - &crews { unit: crew_block, for_each: item.labor, key: "crew[{it.slot}]", params: "{it}" }
      - &labor
        unit: labor_total
        params: { first: "{span:crew_block.first}", last: "{span:crew_block.last}" }
      - &total
        unit: job_total
        params:
          total_formula:
            sum_existing: [labor_total.labor_total, haul.haul_total, cost_summary.costs_total]

  line_item:
    column_widths: { A: 28, B: 12, C: 10, D: 10, E: 12, F: 14 }
    units:
      - *header
      - *notes
      - unit: quantity
        when: item.takeoff
        variant_from: item.takeoff.kind
        variants: quantity_kinds
        key: quantity
        params: "{item.takeoff}"
      - *crews
      - *labor
      - { unit: haul, when: item.spreads, params: "{item.spreads}" }
      - { unit: cost_block, for_each: item.cost_details, key: "cost[{it.name}]", params: "{it}" }
      - unit: cost_summary
        when: item.cost_details
        params:
          lines:
            for_each: item.cost_details
            as: { name: "{it.name}", ref: "={ref:cost[{it.name}].subtotal}" }
      - *total

quantity_kinds:
  linear: quantity_linear
  count:  quantity_count
